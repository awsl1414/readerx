# ReaderX Design Tokens — 设计令牌
# 全新定义的完整 token 系统，基于 oklch 色彩空间
# 阅读器产品专用：安静、稳定、内容优先

# ═══════════════════════════════════════
# 颜色
# ═══════════════════════════════════════

color:
  # Surface 层级（零 border，靠明度区分）
  # 暗色主题（默认）
  surface:
    0: "oklch(0.13 0.01 260)"    # 基底 — 侧边栏、最底层
    1: "oklch(0.16 0.012 260)"   # 内容 — 主内容区
    2: "oklch(0.19 0.014 260)"   # 提升 — 卡片、hover
    3: "oklch(0.22 0.015 260)"   # 悬浮 — 弹出层、active
    4: "oklch(0.25 0.016 260)"   # 模态 — 对话框 + backdrop-blur

  # 亮色主题 Surface
  surface-light:
    0: "oklch(0.98 0.002 260)"   # 基底
    1: "oklch(0.995 0.001 260)"  # 内容
    2: "oklch(0.96 0.003 260)"   # 提升
    3: "oklch(0.93 0.004 260)"   # 悬浮
    4: "oklch(0.90 0.005 260)"   # 模态

  # 语义色
  primary:
    50:  "oklch(0.95 0.02 260)"
    100: "oklch(0.90 0.04 260)"
    200: "oklch(0.80 0.08 260)"
    300: "oklch(0.72 0.13 260)"
    400: "oklch(0.67 0.16 260)"
    500: "oklch(0.62 0.19 260)"  # 主操作色
    600: "oklch(0.58 0.17 260)"
    700: "oklch(0.55 0.15 260)"
    800: "oklch(0.50 0.12 260)"
    900: "oklch(0.45 0.10 260)"

  success:
    50:  "oklch(0.96 0.02 155)"
    500: "oklch(0.65 0.17 155)"
    700: "oklch(0.50 0.12 155)"

  warning:
    50:  "oklch(0.97 0.02 80)"
    500: "oklch(0.75 0.15 80)"
    700: "oklch(0.60 0.10 80)"

  danger:
    50:  "oklch(0.96 0.02 25)"
    500: "oklch(0.60 0.20 25)"
    700: "oklch(0.45 0.15 25)"

  # 文字
  text:
    primary:   "oklch(0.95 0.01 260)"    # 主要文字
    secondary: "oklch(0.65 0.02 260)"    # 次要文字
    disabled:  "oklch(0.45 0.02 260)"    # 禁用文字

  # 亮色文字
  text-light:
    primary:   "oklch(0.20 0.02 260)"
    secondary: "oklch(0.45 0.02 260)"
    disabled:  "oklch(0.65 0.01 260)"

  # 边框
  border:
    default: "oklch(0.25 0.01 260)"
    subtle:  "oklch(0.20 0.01 260)"

  border-light:
    default: "oklch(0.88 0.005 260)"
    subtle:  "oklch(0.93 0.003 260)"

# ═══════════════════════════════════════
# 排版
# ═══════════════════════════════════════

font:
  family:
    ui: "'Inter', system-ui, -apple-system, sans-serif"
    reader: "'Noto Serif SC', 'Source Han Serif SC', 'Georgia', serif"
    mono: "'Geist Mono', 'JetBrains Mono', 'Fira Code', monospace"

  size:
    xs: "0.75rem"      # 12px — 角标、辅助信息
    sm: "0.875rem"     # 14px — 次要文字
    md: "1rem"         # 16px — 正文（默认）
    lg: "1.125rem"     # 18px — 小标题
    xl: "1.25rem"      # 20px — 区块标题
    2xl: "1.5rem"      # 24px — 页面标题
    3xl: "2rem"        # 32px — Hero 标题

  # 阅读器字号（用户可调范围）
  # 实施时统一使用 rem，px 值仅供参考
  reader-size:
    min: "0.875rem"    # 14px
    default: "1rem"    # 16px
    max: "1.5rem"      # 24px

  weight:
    normal: 400
    medium: 500
    semibold: 600

  lineHeight:
    tight: 1.25        # 标题
    normal: 1.5        # UI 文字
    relaxed: 1.75      # 列表项
    reader: 1.8        # 阅读器（默认值，用户可调范围 1.5-2.5）

# ═══════════════════════════════════════
# 间距
# ═══════════════════════════════════════

spacing:
  0: "0"
  0.5: "0.125rem"     # 2px
  1: "0.25rem"        # 4px  — 最小元素间距
  1.5: "0.375rem"     # 6px
  2: "0.5rem"         # 8px  — 图标间距
  3: "0.75rem"        # 12px — 卡片间距
  4: "1rem"           # 16px — 内容 padding（移动）
  5: "1.25rem"        # 20px — 阅读器留白（移动）
  6: "1.5rem"         # 24px — 内容 padding（桌面）
  7: "1.75rem"        # 28px — Section 间距
  8: "2rem"           # 32px — 阅读器留白（桌面）
  10: "2.5rem"        # 40px — 大间距
  12: "3rem"          # 48px

# ═══════════════════════════════════════
# 圆角
# ═══════════════════════════════════════

radius:
  sm: "0.25rem"       # 4px  — badge、tag
  md: "0.5rem"        # 8px  — 按钮、输入框
  lg: "0.75rem"       # 12px — 卡片、chip
  xl: "1rem"          # 16px — Sheet、Modal
  2xl: "1.5rem"       # 24px — 页面容器
  full: "9999px"      # 圆形

# ═══════════════════════════════════════
# 阴影
# ═══════════════════════════════════════

shadow:
  sm: "0 1px 2px oklch(0 0 0 / 0.05)"
  md: "0 4px 6px -1px oklch(0 0 0 / 0.1)"
  lg: "0 10px 15px -3px oklch(0 0 0 / 0.1)"
  xl: "0 20px 25px -5px oklch(0 0 0 / 0.15)"

# ═══════════════════════════════════════
# 动效
# ═══════════════════════════════════════

motion:
  duration:
    instant: "0ms"           # 高频操作退化后
    fast: "100ms"            # 进入
    normal: "150ms"          # 页面切换、浮层出现
    slow: "250ms"            # 退出
    fadeout: "200ms"         # 控制层消失

  easing:
    default: "cubic-bezier(0.4, 0, 0.2, 1)"
    in: "cubic-bezier(0.4, 0, 1, 1)"
    out: "cubic-bezier(0, 0, 0.2, 1)"

  # 渐进退化（高频使用后动效自动减弱）
  # 基于 localStorage 记录的操作计数
  degradation:
    thresholds:
      - count: 50            # 50 次后
        duration: 30         # 缩短至 30ms
      - count: 200           # 200 次后
        duration: 0          # instant

  # 允许的动效
  allowed:
    - name: "page cross-fade"
      duration: "150ms"
      easing: "default"
      use: "页面切换（非阅读器）"
    - name: "reader enter fade"
      duration: "150ms"
      easing: "out"
      use: "阅读器进入（fade in）"
    - name: "reader exit fade"
      duration: "150ms"
      easing: "in"
      use: "阅读器退出（fade out）"
    - name: "scale(0.98→1) + fade"
      duration: "150ms"
      use: "弹窗/Sheet 出现"
    - name: "opacity fade out"
      duration: "200ms"
      use: "控制层消失"
    - name: "stagger fade-in"
      duration: "每个 30ms"
      use: "搜索结果到达"

  # 禁止的动效
  forbidden:
    - "bounce / spring 超过 200ms"
    - "旋转 loading（用 skeleton 替代）"
    - "全局 loading 转圈（用渐进加载替代）"
    - "morph / shared element transition"
    - "任何超过 300ms 的过渡"
    - "View Transitions API"
    - "@starting-style 大面积使用"

# ═══════════════════════════════════════
# 响应式断点
# ═══════════════════════════════════════

breakpoint:
  mobile: "0px"
  tablet: "768px"
  desktop: "1024px"
  wide: "1280px"

# ═══════════════════════════════════════
# 阅读器主题
# ═══════════════════════════════════════

reader-theme:
  warm-white:
    bg: "oklch(0.98 0.005 80)"
    text: "oklch(0.30 0.01 60)"
    text-secondary: "oklch(0.50 0.01 60)"
  beige:
    bg: "oklch(0.93 0.02 80)"
    text: "oklch(0.28 0.02 60)"
    text-secondary: "oklch(0.48 0.02 60)"
  green:
    bg: "oklch(0.92 0.03 155)"
    text: "oklch(0.25 0.02 140)"
    text-secondary: "oklch(0.45 0.02 140)"
  sepia:
    bg: "oklch(0.25 0.03 60)"
    text: "oklch(0.75 0.03 70)"
    text-secondary: "oklch(0.55 0.03 70)"
  black:
    bg: "oklch(0.12 0 0)"
    text: "oklch(0.65 0 0)"
    text-secondary: "oklch(0.45 0 0)"

# ═══════════════════════════════════════
# Z-index 层级
# ═══════════════════════════════════════

z-index:
  base: 0
  content: 10
  header: 20
  overlay: 30
  modal: 40
  toast: 50
  reader-control: 60

# ═══════════════════════════════════════
# 导航
# ═══════════════════════════════════════

navigation:
  sidebar-width: "3.5rem"      # 56px 桌面侧边栏
  bottombar-height: "3.5rem"   # 56px 移动底栏
  header-height: "2.75rem"     # 44px 顶栏
  safe-area-bottom: "env(safe-area-inset-bottom)"
  backdrop-blur: "blur(20px)"
